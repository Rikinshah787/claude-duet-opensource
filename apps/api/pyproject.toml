[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-api"
version = "0.1.0"
description = "Claude Duet - local-first proactive AI assistant API"
readme = "../../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Claude Duet" }]
keywords = ["fastapi", "assistant", "local-first", "agents"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]
prod = [
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "qdrant-client>=1.12",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.urls]
Homepage = "https://github.com/your-org/claude-duet"

[tool.setuptools.packages.find]
where = ["."]
include = ["duet*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B008",  # FastAPI uses function calls (Depends(...)) in argument defaults by design
  "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
