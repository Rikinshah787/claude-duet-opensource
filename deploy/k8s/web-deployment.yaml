# Claude Duet web - Next.js 15 on 3000.
#
# NEXT_PUBLIC_API_BASE is inlined at build time by next.config.mjs, so the value
# in duet-config must match what the image was built with. Changing it here
# alone will not change what the browser bundle calls - rebuild the image with
# --build-arg NEXT_PUBLIC_API_BASE=https://your-host.
---
apiVersion: v1
kind: Service
metadata:
  name: duet-web
  namespace: claude-duet
  labels:
    app.kubernetes.io/name: duet-web
    app.kubernetes.io/part-of: claude-duet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: duet-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duet-web
  namespace: claude-duet
  labels:
    app.kubernetes.io/name: duet-web
    app.kubernetes.io/part-of: claude-duet
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: duet-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duet-web
        app.kubernetes.io/part-of: claude-duet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # the `nextjs` user created in apps/web/Dockerfile
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Replace with your registry reference, e.g. ghcr.io/your-org/duet-web:0.1.0
          image: duet-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PUBLIC_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: duet-config
                  key: NEXT_PUBLIC_API_BASE
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js writes to .next/cache at runtime, so an emptyDir is mounted
            # there instead of locking the whole root filesystem.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
