# TEMPLATE ONLY - copy to secret.yaml, replace every value, and keep it out of
# version control (.gitignore covers *.env but not secret.yaml - add it, or
# generate the Secret from a sealed-secrets / external-secrets controller).
#
#   cp secret.example.yaml secret.yaml
#   python -c "import secrets; print(secrets.token_urlsafe(48))"   # DUET_SECRET_KEY
#   kubectl apply -f secret.yaml
#
# DUET_SECRET_KEY encrypts the credential vault (.data/vault.enc). If it is lost
# or rotated, the existing vault CANNOT be decrypted and every connector
# credential must be re-entered. Back it up separately from the volume.
apiVersion: v1
kind: Secret
metadata:
  name: duet-secrets
  namespace: claude-duet
  labels:
    app.kubernetes.io/name: duet
    app.kubernetes.io/part-of: claude-duet
type: Opaque
stringData:
  # Master key for the credential vault. CHANGE THIS.
  DUET_SECRET_KEY: "REPLACE_ME_generate_a_48_byte_url_safe_token"

  # Full SQLAlchemy URL; contains the Postgres password, hence a Secret.
  DUET_DATABASE_URL: "postgresql+psycopg://duet:REPLACE_ME_db_password@duet-postgres:5432/duet"

  # Consumed by the Postgres StatefulSet.
  POSTGRES_USER: "duet"
  POSTGRES_PASSWORD: "REPLACE_ME_db_password"
  POSTGRES_DB: "duet"

  # Only needed when DUET_LLM_PROVIDER=openai. Leave empty for local inference.
  DUET_LLM_API_KEY: ""
