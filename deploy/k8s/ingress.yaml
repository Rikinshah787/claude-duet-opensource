# Single host, two backends: /api/* goes to the API, everything else to the web
# app. Ordering matters - the ingress-nginx controller matches the longest
# prefix, so /api wins over / regardless of the order written here.
#
# Assumes ingress-nginx. For another controller, change ingressClassName and the
# annotation prefix. TLS is commented out; uncomment once cert-manager (or your
# own secret) is in place.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duet
  namespace: claude-duet
  labels:
    app.kubernetes.io/name: duet
    app.kubernetes.io/part-of: claude-duet
  annotations:
    # Uploads and model-backed responses can be slow; raise the defaults.
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - duet.example.com
  #     secretName: duet-tls
  rules:
    - host: duet.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: duet-api
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duet-web
                port:
                  number: 3000
